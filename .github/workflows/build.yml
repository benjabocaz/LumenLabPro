name: Build LumenLab Pro APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Download Depth Anything V2 Large ONNX
        run: |
          mkdir -p app/src/main/assets
          curl -L --fail -o app/src/main/assets/depth_model.onnx \
            https://huggingface.co/onnx-community/depth-anything-v2-large/resolve/main/onnx/model_quantized.onnx

      - name: Build Android APK
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LumenLab-Pro-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
